<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatDataAgent · 数据问数助手</title>
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  :root {
    --primary: #4d6bfe;
    --primary-dark: #3a55e0;
    --bg: #f5f5f6;
    --card: #ffffff;
    --text: #1f2329;
    --text-2: #8a8f99;
    --border: #e5e6eb;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh;
  }

  /* ===== 顶部导航栏 ===== */
  .topbar {
    background: var(--card); border-bottom: 1px solid var(--border);
    padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, #4d6bfe, #7a5cff);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 16px;
  }
  .ds-badge {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2);
    background: var(--bg); padding: 6px 12px; border-radius: 20px;
  }
  .ds-badge .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
  .ds-badge .db { color: var(--text); font-weight: 500; }

  /* ===== 对话区 ===== */
  .chat-area { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .chat-inner { max-width: 800px; margin: 0 auto; padding: 24px 20px 40px; }

  /* 欢迎界面 */
  .welcome { text-align: center; padding: 90px 20px 40px; }
  .welcome .w-logo {
    width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 16px;
    background: linear-gradient(135deg, #4d6bfe, #7a5cff); color: #fff; font-size: 32px;
    display: flex; align-items: center; justify-content: center;
  }
  .welcome h1 { font-size: 24px; margin-bottom: 10px; }
  .welcome p { color: var(--text-2); font-size: 14px; margin-bottom: 30px; }
  .w-suggest { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 560px; margin: 0 auto; }
  .w-suggest .chip {
    padding: 10px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    cursor: pointer; font-size: 13px; color: var(--text); transition: all .15s;
  }
  .w-suggest .chip:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(0,0,0,.06); }

  /* 消息 */
  .msg { display: flex; margin-bottom: 24px; align-items: flex-start; }
  .msg .avatar {
    width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center; font-size: 15px; margin-right: 10px;
  }
  .msg.user .avatar { order: 2; margin-right: 0; margin-left: 10px; background: var(--primary); color: #fff; }
  .msg.assistant .avatar { background: var(--card); border: 1px solid var(--border); }
  .msg .content { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; }
  .msg.user .content { align-items: flex-end; }
  .bubble {
    max-width: 100%; padding: 12px 16px; border-radius: 14px; font-size: 14px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .sql-tag { font-size: 12px; color: #6b7280; margin-top: 8px; font-family: "SF Mono", Consolas, monospace; }

  /* 表格卡片 */
  .table-card {
    width: 100%; margin-top: 10px; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .table-card .tc-wrap { overflow-x: auto; max-height: 300px; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; min-width: 420px; }
  th, td { border-bottom: 1px solid var(--border); padding: 9px 14px; text-align: left; white-space: nowrap; }
  th { background: #fafafa; font-weight: 600; position: sticky; top: 0; }
  tbody tr:hover { background: #fafbff; }
  .table-card .tc-title { padding: 10px 14px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--border); }

  /* 图表卡片 */
  .chart-card { width: 100%; margin-top: 10px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .chart-card .chart { width: 100%; height: 320px; }

  /* ===== 输入栏 ===== */
  .input-bar {
    background: var(--card); border-top: 1px solid var(--border); padding: 12px 20px 18px;
  }
  .input-inner { max-width: 800px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px; }
  .input-box {
    flex: 1; display: flex; align-items: flex-end; border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 14px; background: #fff; transition: border-color .15s, box-shadow .15s;
  }
  .input-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(77,107,254,.12); }
  textarea {
    flex: 1; border: none; outline: none; resize: none; font-size: 14px; line-height: 1.6;
    font-family: inherit; background: transparent; max-height: 160px; min-height: 24px;
  }
  .send-btn {
    width: 38px; height: 38px; border: none; border-radius: 10px; background: var(--primary); color: #fff;
    cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; flex-shrink: 0;
  }
  .send-btn:hover { background: var(--primary-dark); }
  .send-btn:disabled { background: #a9b8ff; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; }
  .input-tip { max-width: 800px; margin: 6px auto 0; font-size: 12px; color: var(--text-2); text-align: center; }

  .typing::after { content: "…"; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar">
  <div class="brand">
    <div class="logo">📊</div>
    <span>ChatDataAgent</span>
  </div>
  <div class="ds-badge">
    <span class="dot"></span>
    数据源：<span class="db" id="dbName">连接中…</span>
  </div>
</div>

<!-- 对话区 -->
<div class="chat-area" id="chatArea">
  <div class="chat-inner" id="chatInner">
    <div class="welcome" id="welcome">
      <div class="w-logo">📊</div>
      <h1>数据问数助手</h1>
      <p>用自然语言提问，自动查数据库并生成分析图表</p>
      <div class="w-suggest">
        <div class="chip" onclick="quick('有哪些表？')">有哪些表？</div>
        <div class="chip" onclick="quick('各部门有多少员工？')">各部门有多少员工？</div>
        <div class="chip" onclick="quick('平均薪资是多少？')">平均薪资是多少？</div>
        <div class="chip" onclick="quick('员工的性别分布')">员工的性别分布</div>
      </div>
    </div>
  </div>
</div>

<!-- 输入栏 -->
<div class="input-bar">
  <div class="input-inner">
    <div class="input-box">
      <textarea id="question" rows="1" placeholder="输入你的数据问题，例如：各部门有多少员工？" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
    </div>
    <button class="send-btn" id="sendBtn" onclick="send()" title="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </div>
  <div class="input-tip">只支持数据查询，Enter 发送，Shift+Enter 换行</div>
</div>

<script>
let threadId = "";
const chatArea = document.getElementById('chatArea');
const chatInner = document.getElementById('chatInner');
const questionEl = document.getElementById('question');
const sendBtn = document.getElementById('sendBtn');
const welcome = document.getElementById('welcome');

async function loadDataSource() {
  try {
    const r = await fetch('/api/tables');
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    document.getElementById('dbName').textContent = d.db_name || '未知';
  } catch (e) {
    document.getElementById('dbName').textContent = '未连接';
  }
}
loadDataSource();

function quick(q) { questionEl.value = q; send(); }

function scrollBottom() { chatArea.scrollTop = chatArea.scrollHeight; }

function addMsg(role, html) {
  if (welcome) welcome.style.display = 'none';
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const avatar = role === 'user' ? '👤' : '🤖';
  div.innerHTML = `<div class="avatar">${avatar}</div><div class="content">${html}</div>`;
  chatInner.appendChild(div);
  scrollBottom();
  return div.querySelector('.content');
}

function escapeHtml(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderTable(columns, rows, msgEl) {
  if (!rows || !rows.length) return;
  const card = document.createElement('div');
  card.className = 'table-card';
  const head = columns.map(c => `<th>${escapeHtml(c)}</th>`).join('');
  const body = rows.slice(0, 50).map(r => `<tr>${r.map(v => `<td>${escapeHtml(v)}</td>`).join('')}</tr>`).join('');
  card.innerHTML = `<div class="tc-title">查询结果（${rows.length} 行）</div><div class="tc-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  msgEl.appendChild(card);
}

function renderChart(chart, msgEl) {
  if (!chart) return;
  const wrap = document.createElement('div');
  wrap.className = 'chart-card';
  const chartDiv = document.createElement('div');
  chartDiv.className = 'chart';
  wrap.appendChild(chartDiv);
  msgEl.appendChild(wrap);
  const ec = echarts.init(chartDiv);
  ec.setOption(buildOption(chart));
  window.addEventListener('resize', () => ec.resize());
}

function buildOption(chart) {
  const { type, x, series } = chart;
  const base = { tooltip: {}, legend: {}, grid: { left: 44, right: 20, bottom: 30, top: 40 } };
  if (type === 'funnel') {
    const data = (series[0]?.data || []).map((v, i) => ({ name: x[i] ?? '', value: v }));
    return {
      tooltip: { trigger: 'item', formatter: '{b}: {c}' },
      legend: { bottom: 0 },
      series: [{
        type: 'funnel', left: '12%', right: '12%', top: 20, bottom: 40,
        sort: 'descending', gap: 2, label: { show: true, position: 'inside' }, data,
      }],
    };
  }
  if (type === 'pie') {
    const data = (series[0]?.data || []).map((v, i) => ({ name: x[i] ?? '', value: v }));
    return { ...base, tooltip: { trigger: 'item' }, series: [{ type: 'pie', radius: '62%', data }] };
  }
  if (type === 'line') {
    return { ...base, tooltip: { trigger: 'axis' }, xAxis: { type: 'category', data: x }, yAxis: { type: 'value' }, series: series.map(s => ({ name: s.name, type: 'line', smooth: true, data: s.data })) };
  }
  return { ...base, tooltip: { trigger: 'axis' }, xAxis: { type: 'category', data: x }, yAxis: { type: 'value' }, series: series.map(s => ({ name: s.name, type: 'bar', barMaxWidth: 40, data: s.data })) };
}

async function send() {
  const question = questionEl.value.trim();
  if (!question) return;
  questionEl.value = '';
  questionEl.style.height = 'auto';
  addMsg('user', `<div class="bubble">${escapeHtml(question)}</div>`);

  const typing = addMsg('assistant', `<div class="bubble typing">正在分析</div>`);
  sendBtn.disabled = true;
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question, thread_id: threadId }),
    });
    const d = await resp.json();
    threadId = d.thread_id || threadId;

    let html = `<div class="bubble">${escapeHtml(d.reply || '')}</div>`;
    if (d.sql) html += `<div class="sql-tag">SQL: ${escapeHtml(d.sql)}</div>`;
    if (d.active_tables && d.active_tables.length) html += `<div class="sql-tag">关联表：${escapeHtml(d.active_tables.join('、'))}</div>`;
    const msgEl = addMsg('assistant', html);
    if (d.table) renderTable(d.table.columns, d.table.rows, msgEl);
    if (d.chart) renderChart(d.chart, msgEl);
  } catch (e) {
    addMsg('assistant', `<div class="bubble">服务异常：${escapeHtml(e.message)}</div>`);
  } finally {
    typing.remove();
    sendBtn.disabled = false;
    questionEl.focus();
  }
}
</script>
</body>
</html>
